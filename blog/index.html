y that classroom experience makes for a virtual assistant you can rely on.\",\"publishedAt\":\"2026-10-20\",\"readingTime\":\"2 min read\",\"tags\":[\"virtual-assistance\",\"business\",\"teaching\"]},{\"slug\":\"5-tasks-to-delegate-first\",\"title\":\"5 Tasks Busy Business Owners Should Delegate First\",\"summary\":\"Not sure what to hand to a virtual assistant first? Start with these five recurring tasks — they eat hours, need care more than genius, and free you for work only you can do.\",\"publishedAt\":\"2026-10-05\",\"readingTime\":\"2 min read\",\"tags\":[\"virtual-assistance\",\"business\",\"productivity\"]},{\"slug\":\"teaching-computer-science-cambridge-western-australia\",\"title\":\"Teaching Computer Science Across Cambridge and Western Australia Curricula\",\"summary\":\"At my school in Hua Hin, primary and upper secondary follow Cambridge while lower secondary follows Western Australia. Teaching across both has made me a better, clearer teacher.\",\"publishedAt\":\"2026-09-22\",\"readingTime\":\"2 min read\",\"tags\":[\"teaching\",\"computer-science\",\"education\"]},{\"slug\":\"systems-beat-hustle\",\"title\":\"Why Systems Beat Hustle: Sustainable Online Growth\",\"summary\":\"Hustle gets a business started; systems are what let it keep growing without eating the owner's life. The small systems that compound — and where a VA fits.\",\"publishedAt\":\"2026-09-21\",\"readingTime\":\"2 min read\",\"tags\":[\"virtual-assistance\",\"productivity\",\"organization\"]},{\"slug\":\"minecraft-education-learning-through-play\",\"title\":\"Minecraft Education: Learning Through Play, Online\",\"summary\":\"I taught Minecraft Education online for a Singapore-based program in 2023–2024. Here is what a game world can teach about coding, collaboration and problem-solving.\",\"publishedAt\":\"2026-09-08\",\"readingTime\":\"2 min read\",\"tags\":[\"teaching\",\"minecraft-education\",\"edtech\"]},{\"slug\":\"supporting-online-teachers-and-coaches-as-va\",\"title\":\"Supporting an Online Teacher or Coach as a VA\",\"summary\":\"Online teachers drown in the same admin as any business — plus classrooms. As both a teacher and a VA, here is the support that helps educators most.\",\"publishedAt\":\"2026-09-07\",\"readingTime\":\"2 min read\",\"tags\":[\"teaching\",\"virtual-assistance\"]},{\"slug\":\"canva-shortcuts-for-non-designers\",\"title\":\"Canva Shortcuts for Non-Designers\",\"summary\":\"You do not need to be a designer to make clean posts in Canva — you need five habits. The shortcuts and features I use daily, explained for busy owners.\",\"publishedAt\":\"2026-08-03\",\"readingTime\":\"2 min read\",\"tags\":[\"social-media\",\"virtual-assistance\"]},{\"slug\":\"how-to-brief-your-va\",\"title\":\"How to Brief Your VA So Work Comes Back Right\",\"summary\":\"Most 'the VA got it wrong' stories are brief stories. The five things a good task brief includes — written from the receiving end.\",\"publishedAt\":\"2026-07-06\",\"readingTime\":\"2 min read\",\"tags\":[\"virtual-assistance\",\"productivity\"]},{\"slug\":\"file-naming-systems\",\"title\":\"File Naming Systems That End the Mess\",\"summary\":\"Search only works when names make sense. The simple file naming rules I set up for clients and classrooms — dates first, no 'final', and names that sort themselves.\",\"publishedAt\":\"2026-06-15\",\"readingTime\":\"2 min read\",\"tags\":[\"organization\",\"productivity\"]},{\"slug\":\"preparing-reports-people-actually-read\",\"title\":\"Preparing Reports People Actually Read\",\"summary\":\"Most reports fail in the first ten seconds — the reader cannot find the point. How I structure a report so busy people read it, understand it and act on it.\",\"publishedAt\":\"2026-06-01\",\"readingTime\":\"2 min read\",\"tags\":[\"virtual-assistance\",\"productivity\",\"organization\"]},{\"slug\":\"tools-i-use-as-a-tech-savvy-va\",\"title\":\"Tools I Use as a Tech-Savvy VA\",\"summary\":\"My everyday toolkit — the apps behind my VA and teaching cess — defining the target, verifying details, and formatting a list outreach can start from immediately.\",\"publishedAt\":\"2026-03-09\",\"readingTime\":\"2 min read\",\"tags\":[\"virtual-assistance\",\"crm\",\"productivity\"]},{\"slug\":\"shopify-product-listing-checklist\",\"title\":\"Shopify Product Listing Checklist: What Good Looks Like\",\"summary\":\"A product listing is a tiny salesperson. The checklist I use when adding products to Shopify or WooCommerce stores — titles, photos, variants, tags and the details buyers look for.\",\"publishedAt\":\"2026-02-23\",\"readingTime\":\"2 min read\",\"tags\":[\"shopify\",\"virtual-assistance\"]},{\"slug\":\"wordpress-updates-to-delegate\",\"title\":\"WordPress Updates Every Owner Should Delegate\",\"summary\":\"Your website should not need you. The WordPress tasks that quietly pile up on owners — and why handing them to a VA keeps the site fresh and safe.\",\"publishedAt\":\"2026-02-09\",\"readingTime\":\"2 min read\",\"tags\":[\"wordpress\",\"virtual-assistance\"]},{\"slug\":\"scheduling-a-month-of-posts-in-one-afternoon\",\"title\":\"Scheduling a Month of Posts in One Afternoon\",\"summary\":\"Batching is the whole secret. My step-by-step afternoon routine for designing, captioning and scheduling a full month of social media posts.\",\"publishedAt\":\"2026-01-26\",\"readingTime\":\"2 min read\",\"tags\":[\"social-media\",\"productivity\"]},{\"slug\":\"social-media-content-calendar-canva\",\"title\":\"Building a Social Media Content Calendar in Canva\",\"summary\":\"Consistent posting starts with a calendar, not inspiration. How I plan a month of content in Canva — pillars, templates and a rhythm the owner can approve in minutes.\",\"publishedAt\":\"2026-01-12\",\"readingTime\":\"2 min read\",\"tags\":[\"social-media\",\"virtual-assistance\"]},{\"slug\":\"organize-google-drive-from-scratch\",\"title\":\"How I Organize a Google Drive From Scratch\",\"summary\":\"Shared Drives grow like jungles. Here is the simple folder structure and naming system I set up so a whole team can find any file in seconds.\",\"publishedAt\":\"2025-12-22\",\"readingTime\":\"2 min read\",\"tags\":[\"organization\",\"virtual-assistance\",\"productivity\"]},{\"slug\":\"crm-cleanup-checklist\",\"title\":\"CRM Cleanup Checklist: From Messy to Trustworthy\",\"summary\":\"A CRM nobody trusts is just an expensive address book. This is the checklist I use to clean one up — duplicates, dead fields, inconsistent names and all.\",\"publishedAt\":\"2025-12-08\",\"readingTime\":\"2 min read\",\"tags\":[\"crm\",\"organization\",\"virtual-assistance\"]},{\"slug\":\"inbox-zero-routine-for-busy-owners\",\"title\":\"Inbox Zero: My Routine for Busy Business Owners\",\"summary\":\"Inbox zero is not about an empty screen — it is about knowing nothing important is hiding. Here is the simple routine I run for clients.\",\"publishedAt\":\"2025-11-24\",\"readingTime\":\"2 min read\",\"tags\":[\"virtual-assistance\",\"organization\",\"productivity\"]},{\"slug\":\"what-a-virtual-assistant-actually-does\",\"title\":\"What a Virtual Assistant Actually Does All Day\",\"summary\":\"People imagine a VA just answers email. In reality the day is a mix of data, inboxes, calendars, content and quiet systems work that keeps a business running.\",\"publishedAt\":\"2025-11-10\",\"readingTime\":\"2 min read\",\"tags\":[\"virtual-assistance\",\"productivity\"]}]}]]}]\n"])</script><script>self.__next_f.push([1,"1a:[[\"$\",\"meta\",\"0\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"1\",{\"charSet\":\"utf-8\"}],[\"$\",\"title\",\"2\",{\"children\":\"Blog | Rica Mae G. Supa Portfolio\"}],[\"$\",\"meta\",\"3\",{\"name\":\"description\",\"content\":\"Articles on virtual assistance, teaching Computer Science, and learning through play — by Rica Mae Supa, ICT \u0026 Computer Science Teacher and Virtual Assistant in Hua Hin.\"}],[\"$\",\"link\",\"4\",{\"rel\":\"author\",\"href\":\"https://ricamaesupa
